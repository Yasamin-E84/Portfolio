  <link rel="stylesheet" href="assets/css/styles.css">

<body>
  <!-- Header -->
  <header class="header" role="banner">
    <div class="header__container">
      <a href="index.html" class="header__logo" aria-label="Home">Yasamin Soraghi</a>
      <nav class="nav" role="navigation" aria-label="Main navigation">
        <ul class="nav__list">
          <li><a href="index.html" class="nav__link">Home</a></li>
          <li><a href="work.html" class="nav__link active">Work</a></li>
          <li><a href="index.html#skills" class="nav__link">Skills</a></li>

          <li><a href="contact.html" class="nav__link">Contact</a></li>
        </ul>
      </nav>

  </header>

  <!-- Work Page Header -->
  <section class="work-page-header">
    <div class="container">
      <h1 class="section__title">My Work</h1>
      <p class="text-center" style="color: var(--text2); max-width: 600px; margin: 0 auto;">
        A collection of projects showcasing my work across frontend development, WordPress, motion graphics, and backend learning.
      </p>
    </div>
  </section>

  <!-- Search -->
  <section class="section" style="padding-top: 2rem;">
    <div class="container">
      <div class="work-search">
        <input 
          type="text" 
          class="work-search__input" 
          placeholder="Search projects by title, description, or tags..."
          aria-label="Search projects"
        >
      </div>
    </div>
  </section>

  <!-- Filters -->
  <section class="section" style="padding-top: 0;">
    <div class="container">
      <div class="work-filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="frontend">Frontend</button>
        <button class="filter-btn" data-filter="wordpress">WordPress</button>
        <button class="filter-btn" data-filter="motion">Motion</button>
        <button class="filter-btn" data-filter="backend">Backend</button>
      </div>
    </div>
  </section>

  <!-- Projects Grid -->
  <section class="section" style="padding-top: 0;">
    <div class="container">
      <div class="projects-grid" id="projects-container"></div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer" role="contentinfo">
    <div class="footer__container">
      <p class="footer__name">Fatemeh Soraghi (Yasamin)</p>
      <ul class="footer__links">
        <li><a href="https://github.com/Yasamin-E84" target="_blank" rel="noopener noreferrer" class="footer__link">GitHub</a></li>
        <li><a href="https://t.me/yasamin_e84" target="_blank" rel="noopener noreferrer" class="footer__link">Telegram</a></li>
        <li><a href="mailto:fatemeh.s8424@gmail.com" class="footer__link">Email</a></li>

    </div>
