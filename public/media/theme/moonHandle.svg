<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 100 100"
  role="img"
  aria-label="Moon"
>
  <defs>
    <radialGradient id="moonFill" cx="36%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#F8FBFF"/>
      <stop offset="42%" stop-color="#D9E8FF"/>
      <stop offset="78%" stop-color="#9CB9F3"/>
      <stop offset="100%" stop-color="#7E99D8"/>
    </radialGradient>

    <radialGradient id="moonHighlight" cx="34%" cy="28%" r="58%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="46%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="moonEdge" x1="18%" y1="14%" x2="84%" y2="88%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.82"/>
      <stop offset="52%" stop-color="#C8D8FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5D75B6" stop-opacity="0.62"/>
    </linearGradient>

    <mask id="crescentMask">
      <rect width="100" height="100" fill="black"/>
      <circle cx="46" cy="50" r="41" fill="white"/>
      <circle cx="64" cy="41" r="35" fill="black"/>
    </mask>
  </defs>

  <!-- Tight crescent that fills the artboard much better -->
  <g mask="url(#crescentMask)">
    <circle cx="46" cy="50" r="41" fill="url(#moonFill)"/>
    <circle cx="46" cy="50" r="39.6" fill="none" stroke="url(#moonEdge)" stroke-width="1.6"/>
    <circle cx="39" cy="42" r="27" fill="url(#moonHighlight)"/>

    <g fill="#EEF4FF" opacity="0.32">
      <circle cx="31" cy="60" r="3.2"/>
      <circle cx="43" cy="27" r="2.5"/>
      <circle cx="49" cy="66" r="2.1"/>
      <circle cx="24" cy="44" r="1.9"/>
    </g>
  </g>
</svg>
